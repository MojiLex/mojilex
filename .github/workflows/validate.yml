name: Validate dataset

on:
  pull_request:
  push:
    branches:
      - main
      - "mojilex/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  schema-integrity-canonical-policy-no-media-secret-scan:
    name: schema / integrity / canonical / policy / no-media / secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run strict offline validation
        run: python tools/validate.py . --strict

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check maintenance code style
        run: |
          python -m ruff check tools tests
          python -m ruff format --check tools tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  build-index:
    name: build-index reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Build the same revision twice
        run: |
          python tools/build_index.py . --output work/dist-first --revision "${GITHUB_SHA}"
          python tools/build_index.py . --output work/dist-second --revision "${GITHUB_SHA}" --skip-validation
          diff --recursive --brief work/dist-first work/dist-second
