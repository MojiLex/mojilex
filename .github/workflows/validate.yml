name: Validate dataset

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "mojilex/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  schema-integrity-canonical-policy-no-media-secret-scan:
    name: schema / integrity / policy / no-media (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run strict offline validation
        run: python tools/validate.py . --strict

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check maintenance code style
        run: |
          python -m ruff check tools tests
          python -m ruff format --check tools tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  build-index:
    name: build-index reproducibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned validator dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Build the same revision twice
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from datetime import UTC, datetime
          from pathlib import Path

          revision = os.environ["GITHUB_SHA"]
          epoch = int(subprocess.check_output(
              ["git", "show", "-s", "--format=%ct", revision], text=True
          ).strip())
          snapshot_id = f"data-{datetime.fromtimestamp(epoch, UTC):%Y.%m.%d}.1"
          build = [
              sys.executable, "tools/build_index.py", ".",
              "--revision", revision,
              "--snapshot-id", snapshot_id,
              "--source-date-epoch", str(epoch),
          ]
          subprocess.run([*build, "--output", "work/dist-first"], check=True)
          subprocess.run([
              *build, "--output", "work/dist-second", "--skip-validation"
          ], check=True)
          subprocess.run([
              sys.executable, "tools/validate_distribution.py", ".", "work/dist-first"
          ], check=True)
          first, second = Path("work/dist-first"), Path("work/dist-second")
          left = {p.relative_to(first): p.read_bytes() for p in first.rglob("*") if p.is_file()}
          right = {p.relative_to(second): p.read_bytes() for p in second.rglob("*") if p.is_file()}
          assert left == right, "distribution builds differ"
