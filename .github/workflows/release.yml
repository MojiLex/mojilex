name: Validate dataset release candidate

on:
  push:
    tags: ["data-*.*.*.*"]

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable candidate tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate tag and source commit
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^data-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "Invalid dataset snapshot candidate tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Dataset candidate tags must point to a commit reachable from origin/main" >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Resolve immutable candidate inputs
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")" >> "${GITHUB_ENV}"
      - name: Validate canonical source
        run: |
          python tools/validate.py . --strict
          python -m unittest discover -s tests -v
      - name: Build and validate exact candidate tree
        run: |
          python tools/build_index.py . --output dist/index --revision "${GITHUB_SHA}" --snapshot-id "${GITHUB_REF_NAME}" --source-date-epoch "${SOURCE_DATE_EPOCH}"
          python tools/validate_distribution.py . dist/index
      - name: Upload CI-only candidate tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dataset-release-candidate-${{ github.ref_name }}
          path: dist/index
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
